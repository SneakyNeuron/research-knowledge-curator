[project]
name = "research-knowledge-curator"
version = "0.1.0"
description = "Agent-maintained, evidence-anchored research knowledge base"
readme = "README.md"
authors = [
    { name = "Vojtěch Kubín" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "typer==0.27.3",
]

[project.scripts]
rkc = "research_knowledge_curator.cli:main"
research-knowledge-curator = "research_knowledge_curator.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-socket==0.8.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
# Specs are prose; their embedded Python sketches are not formatted or linted.
extend-exclude = ["specs/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--disable-socket"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
