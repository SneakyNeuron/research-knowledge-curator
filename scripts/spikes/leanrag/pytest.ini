# The harness's own pytest configuration, so its tests do not pick up the
# repository's (whose --disable-socket needs pytest-socket, absent from the
# harness venv). Run from this directory with the harness venv:
#   TIKTOKEN_CACHE_DIR=work/tiktoken work/venv/bin/pytest -q
[pytest]
testpaths = tests
pythonpath = .
addopts = --strict-markers
# jieba (an upstream dependency) has invalid escape sequences that Python 3.12
# reports when it compiles them on import.
filterwarnings =
    ignore:invalid escape sequence:SyntaxWarning
