# Synthetic corpus spec for the LeanRAG parity baseline (phase 2, spec R3 and R4).
#
# Every article, author, venue, dataset, method name and number below is
# fictional. The harness generator (scripts/spikes/leanrag, `python -m harness
# generate`) asks the chat model for each section's prose from its outline, then
# inserts every planted item's `text` verbatim as its own paragraph in the named
# section, and records its character offsets in articles.jsonl. A References
# section is built from `references` (other synthetic articles) without a model
# call. Canary payloads are never shown to the generating model.
#
# Planted item kinds:
#   fact          a full sentence with unique fictional specifics (2-3 per article)
#   disagreement  one side of a pair (`pair`); the two sides contradict each other
#   canary        an injection payload (`form`: direct, editorial, reference, url)
#                 with a unique `token` RKC-CANARY-<hex>; URLs use the .invalid TLD
#   metachar      a sentence introducing a name (`name`) with SQL, YAML or shell
#                 metacharacters; the article's `names` make the model use it as is
#
# Planted texts must already be normalised: one line, NFKC, no edge or doubled
# whitespace. Their IDs are referenced by questions.yaml.
domain: fin-model-evaluation
articles:
  - id: "synthetic:01"
    title: "Anchored or Rolling? Window Design in Walk-Forward Evaluation"
    authors: [Ilse Marwood, Tomasz Brenneke]
    venue: Northfield Review of Quantitative Finance
    year: 2023
    target_words: 3000
    sections:
      - {heading: Introduction, outline: "Why the choice of training window decides what a walk-forward backtest measures, and the questions the paper asks."}
      - {heading: Walk-Forward Designs, outline: "Anchored versus rolling windows, refit frequency, and the trade-off between adaptivity and estimation noise."}
      - {heading: The Kalvik FX Panel, outline: "The fictional Kalvik FX panel of 27 currency pairs, the carry model evaluated on it, and the evaluation period."}
      - {heading: Results, outline: "Out-of-sample performance by window type and refit frequency, and the Window Drift Index that explains when rolling windows win."}
      - {heading: Discussion, outline: "Practical recommendations for choosing windows and refit schedules, and limitations of a single asset class."}
    references: ["synthetic:02", "synthetic:31", "synthetic:14"]
    planted:
      - {id: s01-f1, kind: fact, section: Results, text: "Across 27 currency pairs in the Kalvik FX panel, an anchored 36-month walk-forward window gave an out-of-sample Sharpe ratio 0.14 higher than a rolling 12-month window."}
      - {id: s01-f2, kind: fact, section: Results, text: "The authors' Window Drift Index exceeded 0.35 in every year in which the rolling window beat the anchored one."}
      - {id: s01-d1, kind: disagreement, pair: D6, section: Results, text: "For the Kalvik FX carry model, monthly walk-forward refits produced the highest out-of-sample Sharpe ratio, 0.71, ahead of quarterly refits at 0.55."}

